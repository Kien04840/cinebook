name: CineBook CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Backend Verification (Java 21 + Maven)
  # ==========================================
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Backend Unit & Integration Tests
        run: ./mvnw clean test -B
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
          VNPAY_TMN_CODE: 2QXUI4J4
          VNPAY_HASH_SECRET: RAIUBACKMSUTTBDXGSZLGXDTZUXISGEX

      - name: Package JAR Artifact
        run: ./mvnw package -DskipTests -B

  # ==========================================
  # Frontend Verification (Node 20 + Vue 3)
  # ==========================================
  frontend-verify:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Production Distribution
        working-directory: ./frontend
        run: npm run build

