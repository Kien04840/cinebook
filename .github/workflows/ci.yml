name: CineBook CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Backend Verification (Java 21 + Maven)
  # ==========================================
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cinebook_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Backend Unit & Integration Tests
        run: ./mvnw clean test -B
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/cinebook_test?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'CineBookTestJwtSecretKeyForTestingPurposesOnly2026Min32Chars' }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE || 'TEST_TMN_CODE' }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET || 'TEST_VNPAY_HASH_SECRET_KEY_FOR_UNIT_TESTING_ONLY' }}

      - name: Package JAR Artifact
        run: ./mvnw package -DskipTests -B

  # ==========================================
  # Frontend Verification (Node 20 + Vue 3)
  # ==========================================
  frontend-verify:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build Production Distribution
        working-directory: ./frontend
        run: npm run build

