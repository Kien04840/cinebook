spring:
  application:
    name: cinebook-test

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cinebook?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jpa:
    open-in-view: false
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
        generate_statistics: true

jwt:
  secret: ${JWT_SECRET:CineBookTestJwtSecretKeyForTestingPurposesOnly2026Min32Chars}
  expiration: 900000
  refresh-token:
    expiration: 604800000
  reset-token:
    expiration: 900000

tmdb:
  api-key: ${TMDB_BEARER_TOKEN:}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  language: en-US
  poster-size: w500
  backdrop-size: original
  connect-timeout-ms: 5000
  read-timeout-ms: 10000

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:TEST_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET:TEST_VNPAY_HASH_SECRET_KEY_FOR_UNIT_TESTING_ONLY}
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:5173/payment/result
  version: "2.1.0"
  command: "pay"
  order-type: "other"

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

