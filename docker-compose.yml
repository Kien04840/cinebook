version: '3.8'

services:
  # MySQL 8.0 Database
  mysql:
    image: mysql:8.0
    container_name: cinebook-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cinebook}
      MYSQL_USER: ${DB_USERNAME:-cinebook}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cinebook_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-cinebook}", "-p${DB_PASSWORD:-cinebook_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cinebook-network

  # Spring Boot Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinebook-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-cinebook}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-cinebook}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cinebook_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-2QXUI4J4}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-RAIUBACKMSUTTBDXGSZLGXDTZUXISGEX}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payment/result}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-588}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@cinebook.com}
    ports:
      - "8080:8080"
    networks:
      - cinebook-network

  # Vue 3 Frontend SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinebook-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - cinebook-network

volumes:
  mysql_data:
    driver: local

networks:
  cinebook-network:
    driver: bridge

