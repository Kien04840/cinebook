spring:
  application:
    name: cinebook-test

  datasource:
    url: jdbc:mysql://localhost:3306/cinebook?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 900000
  refresh-token:
    expiration: 604800000
  reset-token:
    expiration: 900000

tmdb:
  api-key: ${TMDB_BEARER_TOKEN:}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  language: en-US
  poster-size: w500
  backdrop-size: original
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
