spring:
  application:
    name: cinebook

  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/cinebook?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000} # 15 minutes (ms)
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days (ms)
  reset-token:
    expiration: ${JWT_RESET_EXPIRATION:900000} # 15 minutes (ms)

tmdb:
  api-key: ${TMDB_API_KEY:}
  base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
  image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
  language: ${TMDB_LANGUAGE:en-US}
  poster-size: ${TMDB_POSTER_SIZE:w500}
  backdrop-size: ${TMDB_BACKDROP_SIZE:original}
  connect-timeout-ms: ${TMDB_CONNECT_TIMEOUT:5000}
  read-timeout-ms: ${TMDB_READ_TIMEOUT:10000}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/result}
  version: "2.1.0"
  command: "pay"
  order-type: "other"

cinebook:
  mail:
    enabled: ${CINEBOOK_MAIL_ENABLED:false}
    from: ${CINEBOOK_MAIL_FROM:noreply@cinebook.com}
    frontend-url: ${CINEBOOK_FRONTEND_URL:http://localhost:5173}
  payment:
    gateway: ${PAYMENT_GATEWAY:vnpay}
    mock:
      refund-result: ${MOCK_REFUND_RESULT:SUCCESS}

